# YOLOv10s with Hier-Vim-T backbone

nc: 80
scales:
  s: [0.33, 0.50, 1024]

backbone:
  # HierVimBackbone outputs [P3(192ch), P4(384ch), P5(768ch)]
  - [-1, 1, HierVimBackbone, []]  # 0 - outputs list [P3, P4, P5]

head:
  # --- Adapt Vim channels to match YOLOv10 head expectations ---
  # P5 channel reduction: 768 → 512
  - [0, 1, Conv, [512, 1, 1]]          # 1 - reduce P5 channels
  - [-1, 1, SPPF, [512, 5]]            # 2 - SPPF on P5
  - [-1, 1, PSA, [512]]                # 3 - PSA on P5

  # Upsample P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 4
  # P4 channel reduction: 384 → 384 (already ok, optionally reduce)
  - [0, 1, Conv, [384, 1, 1]]          # 5 - P4 from backbone
  - [[-1, 4], 1, Concat, [1]]          # 6 - cat P4 + upsampled P5
  - [-1, 3, C2f, [384]]                # 7

  # Upsample → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 8
  # P3 channel reduction: 192 → 256
  - [0, 1, Conv, [256, 1, 1]]          # 9 - P3 from backbone
  - [[-1, 8], 1, Concat, [1]]          # 10 - cat P3 + upsampled P4
  - [-1, 3, C2f, [256]]                # 11 (P3/8-small)

  # Downsample path
  - [-1, 1, Conv, [256, 3, 2]]         # 12
  - [[-1, 7], 1, Concat, [1]]          # 13 - cat with P4 features
  - [-1, 3, C2f, [384]]                # 14 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]]       # 15
  - [[-1, 3], 1, Concat, [1]]          # 16 - cat with P5 features
  - [-1, 3, C2fCIB, [512, True, True]] # 17 (P5/32-large)

  - [[11, 14, 17], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
