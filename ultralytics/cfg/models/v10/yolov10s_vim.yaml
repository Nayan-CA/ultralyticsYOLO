# YOLOv10s with Hier-Vim-T backbone
nc: 80
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, HierVimBackbone, []]  # 0 — outputs list [P3(192ch), P4(384ch), P5(768ch)]

head:
  # ── Extract individual maps from backbone list ──────────────────
  - [0, 1, Index, [0]]             # 1 — P3 (192ch, stride 8)
  - [0, 1, Index, [1]]             # 2 — P4 (384ch, stride 16)
  - [0, 1, Index, [2]]             # 3 — P5 (768ch, stride 32)

  # ── Top-down path ───────────────────────────────────────────────
  - [3, 1, Conv, [512, 1, 1]]      # 4 — reduce P5: 768→512
  - [4, 1, SPPF, [512, 5]]         # 5
  - [5, 1, PSA, [512]]             # 6

  - [6, 1, nn.Upsample, [None, 2, "nearest"]]   # 7
  - [[7, 2], 1, Concat, [1]]       # 8 — cat P4(384) + up-P5(512) = 896
  - [8, 3, C2f, [384]]             # 9

  - [9, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[10, 1], 1, Concat, [1]]      # 11 — cat P3(192) + up-P4(384) = 576
  - [11, 3, C2f, [256]]            # 12 (P3/8-small)

  # ── Bottom-up path ──────────────────────────────────────────────
  - [12, 1, Conv, [256, 3, 2]]     # 13
  - [[13, 9], 1, Concat, [1]]      # 14 — cat P4 features
  - [14, 3, C2f, [384]]            # 15 (P4/16-medium)

  - [15, 1, SCDown, [512, 3, 2]]   # 16
  - [[16, 6], 1, Concat, [1]]      # 17 — cat P5 features
  - [17, 3, C2fCIB, [512, True, True]]  # 18 (P5/32-large)

  - [[12, 15, 18], 1, v10Detect, [nc]]  # Detect(P3, P4, P5)
